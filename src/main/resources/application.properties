# Default Profile Configuration
# Set active profile: dev, test, or prod
# Override with environment variable: SPRING_PROFILES_ACTIVE=dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Additional profiles to load secrets
# Spring will automatically look for application-{profile}-secrets.properties
spring.config.import=optional:file:./src/main/resources/application-dev-secrets.properties[.properties],optional:file:./src/test/resources/application-test-secrets.properties[.properties]

# Common Database Configuration (overridden by profile-specific configs)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# Common JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Common Server Configuration
server.error.include-stacktrace=never

# ML Service Configuration
service.ml.url=${ML_SERVICE_URL}
service.ml.secret=${ML_SERVICE_SECRET_KEY}

# Application Configuration
app.public-base-url=${PUBLIC_BASE_URL}

