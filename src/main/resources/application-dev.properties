# Development Profile Configuration
# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/text2sql_dev}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logging Configuration for Development
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.text2sql=DEBUG

# Server Configuration
server.error.include-stacktrace=on_param
server.port=8080

# ML Service Configuration
service.ml.url=${ML_SERVICE_URL:http://localhost:8000}
service.ml.secret=${ML_SERVICE_SECRET_KEY}

# Application Configuration
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
